# Build and publish a signed Windows release.
#
# Triggered by pushing a version tag:
#     git tag v1.0.1
#     git push origin v1.0.1
#
# GitHub builds the installer on a real Windows machine, signs it with the
# school's private key, and publishes a release containing both the setup .exe
# and the latest.json the app's update checker reads.
#
# Two repository secrets are required (Settings > Secrets and variables >
# Actions):
#     TAURI_SIGNING_PRIVATE_KEY           the contents of jws-updater.key
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD  empty, unless a password was set

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: write         # needed to create the release

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The Rust core has no Tauri dependency, so it tests on Linux in seconds
      # rather than waiting for a Windows runner to warm up.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev

      - run: npm ci
      - run: cargo test --workspace
      - run: npm test
      - run: npm run build

  build:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Cache the Rust build so later releases take minutes, not half an hour.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'JWS Attendance ${{ github.ref_name }}'
          releaseBody: |
            Windows installer for Janapremi World School.

            Download **JWS Attendance_x.y.z_x64-setup.exe** below and run it.

            Computers already running JWS Attendance will offer this update
            automatically under Settings > Updates.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
